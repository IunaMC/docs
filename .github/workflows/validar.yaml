name: Validar

# Confere os links internos (arquivos e âncoras), o estilo de todo .md e o bloco
# de regras comuns do CLAUDE.md.
# Links externos ficam de fora (--offline): sites fora do ar não quebram o CI.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conferir links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments --no-progress '**/*.md'
          fail: true

      - name: Conferir estilo
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: '**/*.md'

  regras-claude:
    name: Regras do Claude
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conferir o bloco do CLAUDE.md
        run: python3 scripts/regras-comuns.py conferir
