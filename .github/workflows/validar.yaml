name: Validar

# Confere os links internos (arquivos e âncoras) e o estilo de todo .md.
# Links externos ficam de fora (--offline): sites fora do ar não quebram o CI.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conferir links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments --no-progress '**/*.md'
          fail: true

      - name: Conferir estilo
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: '**/*.md'
